name: ci

# check -> build -> smoke test -> push -> redeploy, all of it in
# vernaillen/workflows. This file only says what is different about this
# repository; the pipeline itself is maintained in one place for every app that
# deploys to the Coolify server.
#
# What `check` does lives in package.json, not here. Today that is
# `pnpm lint && pnpm typecheck && pnpm build`. Adding or reordering a check is
# a package.json change and needs no edit to any workflow.
#
# Repository configuration (Settings -> Secrets and variables -> Actions), all
# set by vernaillen/workflows/scripts/configure-repo.sh:
#   Secrets:   REGISTRY_USERNAME, REGISTRY_PASSWORD  registry on Coolify
#              COOLIFY_TOKEN                         deploy permission
#              BUILD_SECRETS                         github_token=<read-only PAT>;
#                                                    mounted into the build, never
#                                                    stored in a layer
#   Variables: COOLIFY_URL, COOLIFY_APP_UUID         which app to redeploy
#              RADIO_ORIGIN_URL                      public stream proxy URL

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A main-branch run pushes the image and redeploys, so it always finishes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pipeline:
    uses: vernaillen/workflows/.github/workflows/coolify-deploy.yml@v1
    with:
      image-name: vernaillen-astro
      # nginx serving dist/, not a node server: 8080 is what nginx.conf listens
      # on and what the Dockerfile exposes.
      smoke-port: 8080
      smoke-path: /
      # A variable, not a secret: `vars.X` silently evaluates to an empty string
      # when X exists only as a secret, which is how this has been baked in empty.
      # Public value -- it is the URL the browser fetches the stream from.
      build-args: |
        PUBLIC_RADIO_URL=${{ vars.RADIO_ORIGIN_URL }}
      coolify-url: ${{ vars.COOLIFY_URL }}
      coolify-app-uuid: ${{ vars.COOLIFY_APP_UUID }}
    secrets: inherit
