# Serves dist/ inside the container built by ./Dockerfile: slash-less canonical
# URLs, cache headers per path, the host, /links and trailing-slash redirects,
# the 404 page. TLS and ACME are handled by Coolify's proxy in front of this
# container.

server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  charset utf-8;

  # Relative Location headers: nginx sits behind a proxy and must not build
  # redirects from its own container hostname/port.
  absolute_redirect off;

  include /etc/nginx/mime.types;
  types { text/markdown md; }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain text/markdown application/xml;

  # Canonical host is the bare vernaillen.dev; www and the .com domains are
  # attached to this application in Coolify and redirect here.
  if ($host ~* ^(www\.vernaillen\.dev|(www\.)?vernaillen\.com)$) {
    return 301 https://vernaillen.dev$request_uri;
  }

  location = /links {
    return 301 https://vernaillen.dev/;
  }

  # The Nuxt site advertised /sitemap.xml (robots.txt, Search Console);
  # @astrojs/sitemap emits /sitemap-index.xml.
  location = /sitemap.xml {
    return 301 /sitemap-index.xml;
  }

  # Never serve dotfiles.
  location ~ /\. {
    return 404;
  }

  # Canonical URLs and the sitemap are slash-less: /blog/ -> /blog.
  location ~ ^(.+)/$ {
    return 301 $1$is_args$args;
  }

  # Content-hashed build output and the (video-only) /images/ tree never
  # change in place. (Prefix locations: a bare /_astro/ still hits the
  # trailing-slash redirect above and ends up as a 404.)
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location /images/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Generated OG cards keep their URL when their content changes: cache a day.
  location /og/ {
    add_header Cache-Control "public, max-age=86400";
  }

  # Everything else changes in place on deploy (HTML, sitemap, llms.txt, raw
  # markdown): always revalidate. /blog -> blog/index.html without a redirect.
  location / {
    try_files $uri $uri/index.html =404;
    add_header Cache-Control "public, max-age=0, must-revalidate";
  }

  error_page 404 /404.html;
}
